services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: p1-local-only
      POSTGRES_DB: repro
    ports:
      - "127.0.0.1:${REPRO_PG_PORT:-19169}:5432"
    command: ["postgres", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%p] "]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d repro"]
      interval: 1s
      timeout: 5s
      retries: 30
